petl:
  datasourceDir: "${petl.homeDir}/configurations/datasources"
  jobDir: "${petl.homeDir}/configurations/jobs"
  mysql:
    host: ${PETL_MYSQL_HOST}
    port: ${PETL_MYSQL_PORT:3306}
    user: ${PETL_MYSQL_USER}
    password: ${PETL_MYSQL_PASSWORD}

mysqlOpenmrs:
  host: ${petl.mysql.host}
  port: ${petl.mysql.port}
  databaseName: "openmrs"
  user: ${petl.mysql.user}
  password: ${petl.mysql.password}
  options: ""

mysqlReporting:
  host: ${petl.mysql.host}
  port: ${petl.mysql.port}
  # Created, and granted to PETL's MySQL account, by distro-tools' openmrs-db-accounts. No default
  # here: distro-tools always sets PETL_MYSQL_REPORTING_DATABASE (empty unless configured), and Spring
  # only uses a default for an unset variable. Set it, e.g. to openmrs_warehouse.
  databaseName: ${PETL_MYSQL_REPORTING_DATABASE}
  user: ${petl.mysql.user}
  password: ${petl.mysql.password}
  options: ""

sqlServerReporting:
  host: ${PETL_SQLSERVER_HOST}
  port: ${PETL_SQLSERVER_PORT:1433}
  # The database distro-tools creates PETL's SQL Server login on (PETL_SQLSERVER_DATABASE).
  databaseName: ${PETL_SQLSERVER_DATABASE:openmrs_reporting}
  user: ${PETL_SQLSERVER_USER}
  password: ${PETL_SQLSERVER_PASSWORD}
